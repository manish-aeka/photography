<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collection — Anupam Dutta Photography</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#151A17">
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="loader-mark" aria-hidden="true"></div>
  <p class="loader-name">Anupam Dutta Photography</p>
  <div class="loader-bar" aria-hidden="true"></div>
  <p class="loader-msg">This collection couldn’t be loaded. Check your connection and try again.</p>
  <button type="button" class="loader-retry" onclick="location.reload()">Try again</button>
</div>
<noscript><style>.loader{display:none}</style></noscript>

<header class="site-header scrolled" id="header">
  <div class="wrap bar">
    <a href="../index.html" class="brand">
      <img id="brandLogo" alt="" width="40" height="40" loading="lazy" decoding="async">
      <span id="brandName">Anupam Dutta Photography</span>
    </a>
    <a href="../index.html#collections" class="back"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>All collections</a>
  </div>
</header>

<main>
  <section class="cat-head">
    <div class="wrap">
      <p class="kicker">Collection</p>
      <h1 id="title"></h1>
      <p class="cp-desc" id="desc"></p>
      <p class="kicker" id="count"></p>
    </div>
  </section>
  <section class="gallery">
    <div class="wrap"><div class="masonry" id="masonry"></div></div>
  </section>
</main>

<footer class="contact">
  <figure class="contact-bg" id="footerBg" aria-hidden="true" hidden><img alt="" loading="lazy" decoding="async"></figure>
  <div class="wrap">
    <div class="foot">
      <span>© <span id="year">2026</span> <span id="footName">Anupam Dutta Photography</span>. All photographs protected by copyright.</span>
      <span class="foot-links"><a href="./editor.html">Admin</a><a href="../index.html">Back to home</a></span>
    </div>
  </div>
</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photograph viewer" tabindex="-1">
  <div class="v-top">
    <span id="vPos"></span>
    <button class="v-btn" id="vClose" aria-label="Close viewer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg></button>
  </div>
  <div class="v-stage">
    <button class="v-btn" id="vPrev" aria-label="Previous photograph"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 3L5 9l6 6"/></svg></button>
    <img id="vImg" alt="">
    <button class="v-btn" id="vNext" aria-label="Next photograph"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 3l6 6-6 6"/></svg></button>
  </div>
  <div class="v-cap"><strong id="vTitle"></strong></div>
</div>

<script>
(function () {
  var BASE = 'https://res.cloudinary.com/ddyo9iiz9/image/upload/';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function sized(url, w) { return url.indexOf(BASE) === 0 ? url.replace(BASE, BASE + 'f_auto,q_auto,w_' + w + '/') : url; }
  function byId(id) { return document.getElementById(id); }
  byId('year').textContent = new Date().getFullYear();

  var header = byId('header');
  /* Navbar hides while scrolling down and returns on scroll up (always shown near the top or when focused) */
  var lastY = window.scrollY;
  function autoHide() {
    var y = window.scrollY;
    if (y < 120 || y < lastY - 4) header.classList.remove('hide');
    else if (y > lastY + 4 && !(usingKeyboard && header.contains(document.activeElement))) header.classList.add('hide');
    if (Math.abs(y - lastY) > 4) lastY = y;
  }
  // Pin only for real keyboard use: Safari can report focus-visible after a tap (e.g. focus returning to the menu button)
  var usingKeyboard = false;
  document.addEventListener('keydown', function (e) { if (e.key === 'Tab') usingKeyboard = true; });
  document.addEventListener('pointerdown', function () { usingKeyboard = false; }, { passive: true });
  header.addEventListener('focusin', function () { if (usingKeyboard) header.classList.remove('hide'); });
  window.addEventListener('scroll', autoHide, { passive: true });

  var images = [], title = '', vi = 0, opener = null;
  var masonry = byId('masonry'), ratios = ['4/5', '3/2', '1/1', '4/3', '2/3', '3/2'];

  function build() {
    images.forEach(function (url, i) {
      var btn = document.createElement('button');
      btn.className = 'tile';
      btn.style.setProperty('--r', ratios[i % ratios.length]);
      btn.setAttribute('aria-label', 'View photograph ' + (i + 1));
      var img = document.createElement('img');
      img.loading = 'lazy'; img.decoding = 'async'; img.alt = title + ', photograph ' + (i + 1);
      img.onload = function () { img.classList.add('loaded'); };
      img.onerror = function () { img.classList.add('broken'); btn.classList.add('ph'); btn.dataset.label = 'Photograph could not be loaded'; };
      img.src = sized(url, 900);
      btn.appendChild(img);
      btn.addEventListener('click', function () { openViewer(i, btn); });
      masonry.appendChild(btn);
    });
  }

  /* Viewer */
  var viewer = byId('viewer'), vImg = byId('vImg'), vStage = vImg.parentElement;
  function render() {
    var k = vi, big = new Image();
    vImg.style.display = ''; vStage.classList.remove('ph');
    vImg.onerror = function () { vImg.style.display = 'none'; vStage.classList.add('ph'); vStage.dataset.label = 'Photograph could not be loaded'; };
    // Show the grid's copy at once (already cached), then swap in the sharp one when it arrives
    vImg.src = sized(images[vi], 900);
    big.onload = function () { if (k === vi) vImg.src = big.src; };
    big.src = sized(images[vi], 2000);
    [1, -1].forEach(function (d) { new Image().src = sized(images[(vi + d + images.length) % images.length], 2000); });
    vImg.alt = title + ', photograph ' + (vi + 1);
    byId('vTitle').textContent = title;
    byId('vPos').textContent = (vi + 1) + ' of ' + images.length;
  }
  function openViewer(i, from) {
    vi = i; opener = from; render();
    viewer.classList.add('open'); document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () { viewer.classList.add('show'); });
    viewer.focus();
  }
  function closeViewer() {
    viewer.classList.remove('show');
    setTimeout(function () { viewer.classList.remove('open'); }, reduce ? 0 : 300);
    document.body.style.overflow = '';
    if (opener) opener.focus();
  }
  function step(d) { vi = (vi + d + images.length) % images.length; render(); }
  byId('vClose').addEventListener('click', closeViewer);
  byId('vPrev').addEventListener('click', function () { step(-1); });
  byId('vNext').addEventListener('click', function () { step(1); });
  viewer.addEventListener('click', function (e) { if (e.target === viewer || e.target === vStage) closeViewer(); });
  document.addEventListener('keydown', function (e) {
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });
  var sx = null;
  viewer.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  viewer.addEventListener('touchend', function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); sx = null; });

  function hideLoader() { var l = byId('loader'); l.classList.add('done'); l.setAttribute('aria-hidden', 'true'); }

  var index = parseInt(new URLSearchParams(location.search).get('category'), 10);
  fetch('../data/anupam-dutta-photography-data-set.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var s = data.settings || {};
      setTimeout(hideLoader, 300);
      if (s['logo-url']) { byId('brandLogo').src = sized(s['logo-url'], 120); byId('favicon').href = s['logo-url']; }
      if (s['footer-image']) {
        var fb = byId('footerBg').firstChild; byId('footerBg').hidden = false;
        fb.onload = function () { fb.classList.add('loaded'); }; fb.onerror = function () { fb.classList.add('broken'); };
        fb.src = sized(s['footer-image'], 2000);
      }
      if (s['navbar-title']) { byId('brandName').textContent = s['navbar-title']; byId('footName').textContent = s['navbar-title']; }

      var cat = (data.categories || [])[index];
      if (!cat) {
        byId('title').textContent = 'Collection not found';
        masonry.outerHTML = '<p class="empty">This collection does not exist. <a href="../index.html#collections" style="color:var(--accent)">See all collections</a>.</p>';
        return;
      }
      title = cat.title;
      document.title = cat.title + ' — ' + (s['navbar-title'] || 'Anupam Dutta Photography');
      byId('title').textContent = cat.title;
      byId('desc').textContent = cat.description;
      images = (cat['images-url'] || []).filter(Boolean);
      byId('count').textContent = images.length + ' photographs';
      if (images.length) build();
      else masonry.outerHTML = '<p class="empty">No photographs in this collection yet.</p>';
    })
    .catch(function (err) {
      console.error('Could not load site data:', err);
      byId('loader').classList.add('failed');
    });
})();
</script>

</body>
</html>
